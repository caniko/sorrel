# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: atlas
    container: rust:bookworm
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install Rust components
        run: rustup component add clippy rustfmt

      - name: Cache cargo bin (tools)
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: ~/.cargo/bin
          key: cargo-bin-${{ runner.os }}-${{ hashFiles('.forgejo/workflows/ci.yaml', '.github/workflows/ci.yaml') }}

      - name: Test all features
        run: cargo test -p sorrel --all-features

      - name: Test no default features
        run: cargo test -p sorrel --no-default-features

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked

      - name: Install cargo-deny
        run: command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked --version 0.18.3

      - name: Audit dependencies
        run: cargo audit

      - name: Deny dependency policy
        run: cargo deny check bans licenses sources

      - name: Build docs
        run: cargo doc -p sorrel --no-deps --all-features

      - name: Clippy all features
        run: cargo clippy -p sorrel --all-targets --all-features -- --deny warnings

      - name: Clippy no default features
        run: cargo clippy -p sorrel --all-targets --no-default-features -- --deny warnings

      - name: Package crate
        run: cargo package -p sorrel --allow-dirty
