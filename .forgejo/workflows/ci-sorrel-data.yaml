# Generated by simit. Manual edits will be reported as ci=drift.
name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  atlas-nix-trusted:
    runs-on: atlas-nix-trusted
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v4

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Check flake
        run: nix flake check

      - name: Format check
        run: nix develop -c cargo fmt --all -- --check

      - name: Test
        run: nix develop -c cargo test -p sorrel-data

      - name: Check cargo-audit tool
        run: nix develop -c cargo-audit --version

      - name: Check cargo-deny tool
        run: nix develop -c cargo-deny --version

      - name: Clippy
        run: nix develop -c cargo clippy -p sorrel-data --all-targets -- --deny warnings

      - name: Package crate
        run: nix develop -c cargo package -p sorrel-data --allow-dirty --list
