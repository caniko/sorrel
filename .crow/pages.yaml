# Generated by simit. Manual edits will be reported as ci=drift.
name: pages
labels:
  agent: codefloe-global
  platform: linux/amd64
when:
- branch: trunk
  event: push
steps:
- name: deploy-pages
  image: ghcr.io/cachix/devenv:latest
  commands:
  - nix build .#site --no-link
  - test -d result
  - nix run .#.#deploy-pages
  environment:
    CODEBERG_TOKEN:
      from_secret: CODEBERG_TOKEN
