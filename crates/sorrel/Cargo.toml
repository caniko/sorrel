[package]
name = "sorrel"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Native high-performance GUI for manual curation of spike-sorted electrophysiology data."

[[bin]]
name = "sorrel"
path = "src/main.rs"

# GUI-subsystem launcher: no console window on Windows (see the file).
[[bin]]
name = "sorrelw"
path = "src/bin/sorrelw.rs"

[dependencies]
sorrel-io.workspace = true
sorrel-cache.workspace = true
sorrel-data.workspace = true
sorrel-compute.workspace = true
sorrel-render.workspace = true
sorrel-ui.workspace = true
sorrel-gpu.workspace = true
sorrel-remote.workspace = true
eframe.workspace = true
egui.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
serde = { workspace = true, optional = true }
blake3 = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }
rand = { version = "0.9", optional = true }

# eframe's Linux window backends are deliberately enabled only for Linux
# targets. Windows uses the native Win32 backend and macOS uses Cocoa/Metal;
# neither should inherit Wayland/X11 feature dependencies.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[features]
default = ["phy-export"]
# `sorrel export-phy`, the serve tool and the GUI button.
phy-export = ["sorrel-data/phy-export"]
hdf5 = ["sorrel-io/hdf5", "sorrel-data/hdf5"]
# `sorrel dev ...` and `sorrel diff --record`: the bench results DB.
dev = ["sorrel-data/dev", "dep:serde", "dep:blake3", "dep:tempfile", "dep:rand"]

# Windows icon, version info and manifest (build.rs; a no-op off Windows).
[build-dependencies]
embed-resource = "3"

[dev-dependencies]
tempfile.workspace = true

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-aarch64-darwin.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-aarch64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-pc-windows-gnullvm]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-aarch64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-aarch64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-aarch64-linux.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-pc-windows-gnu]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-x86_64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-x86_64-windows.zip"
pkg-fmt = "zip"
bin-dir = "{ bin }{ binary-ext }"
[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/{ version }/sorrel-{ version }-x86_64-linux.tar.gz"
pkg-fmt = "tgz"
bin-dir = "{ bin }{ binary-ext }"
