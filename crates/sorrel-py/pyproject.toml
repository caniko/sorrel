[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "sorrel-ephys"
version = "0.4.0"
description = "Native curation GUI for SpikeInterface sortings"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
spikeinterface = ["spikeinterface>=0.100"]
# sorrel.nwb (Units table) and sorrel.neuroconv (NeuroConv data interface)
nwb = ["pynwb>=3.0"]
neuroconv = ["neuroconv>=0.10.2", "pynwb>=3.0"]

[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "sorrel._native"
