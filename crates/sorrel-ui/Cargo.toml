[package]
name = "sorrel-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "egui widgets and views for the Sorrel spike-sorting curation GUI."

[dependencies]
sorrel-io.workspace = true
sorrel-data.workspace = true
sorrel-compute.workspace = true
sorrel-render.workspace = true
sorrel-gpu.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
bytemuck.workspace = true
log.workspace = true
anyhow.workspace = true
rayon.workspace = true

# eframe's Linux window backends are deliberately enabled only for Linux
# targets. Windows and macOS use their native winit backends.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { workspace = true, features = ["wayland", "x11"] }

[dev-dependencies]
tempfile.workspace = true
