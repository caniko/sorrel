[package]
name = "sorrel-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Data providers and file-format backends for Sorrel spike-sorting data."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
flate2.workspace = true
log.workspace = true
dunce = "1"

# Optional HDF5 backend for NWB and Kilosort 4 `rez.mat` (MATLAB v7.3 = HDF5).
# Bundle HDF5 and the gzip/deflate and LZF filters used by NWB/h5py.
hdf5-metno = { version = "0.12.4", features = [
  "static",
  "zlib",
  "lzf",
], optional = true }
# 0.11.3 rejects the bundled HDF5 2.2 headers.
hdf5-metno-sys = { version = "0.11.4", optional = true }
num-traits = { version = "0.2", optional = true }
lz4_flex = { version = "0.12.3", optional = true, default-features = false, features = [
  "std",
  "safe-decode",
] }
ruzstd = { version = "0.9.1", optional = true }
snap = { version = "1.1", optional = true }
inventory = { version = "0.3", optional = true }
# zarrs 0.23 adds an unconditional libz-sys build dependency, even without codecs.
zarrs = { version = "0.22.10", optional = true, default-features = false, features = [
  "filesystem",
  "gzip",
  "transpose",
  "zlib",
] }
jiff = { version = "0.2", default-features = false, optional = true }
tempfile = { workspace = true, optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
ureq = { version = "3.3", default-features = false, features = [
  "rustls",
], optional = true }
url = { version = "2.5", optional = true }
percent-encoding = { version = "2.3", optional = true }
lru = { version = "0.16", optional = true }
md5 = { version = "0.8", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

[features]
default = []
hdf5 = [
  "dep:hdf5-metno",
  "dep:hdf5-metno-sys",
  "dep:jiff",
  "jiff/std",
  "dep:tempfile",
  "dep:uuid",
]
dandi = [
  "zarr",
  "dep:cc",
  "dep:ureq",
  "dep:url",
  "dep:percent-encoding",
  "dep:lru",
  "dep:md5",
]
zarr = [
  "dep:inventory",
  "serde_json/raw_value",
  "dep:zarrs",
  "dep:num-traits",
  "dep:jiff",
  "dep:lz4_flex",
  "dep:ruzstd",
  "dep:snap",
]

[dev-dependencies]
tempfile.workspace = true
