[package]
name = "sorrel-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Data providers and file-format backends for Sorrel spike-sorting data."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
log.workspace = true
dunce = "1"

# Optional HDF5 backend for NWB and Kilosort 4 `rez.mat` (MATLAB v7.3 = HDF5).
# Bundle HDF5 and the gzip/deflate and LZF filters used by NWB/h5py.
hdf5-metno = { version = "0.12.4", features = [
  "static",
  "zlib",
  "lzf",
], optional = true }
# 0.11.3 rejects the bundled HDF5 2.2 headers.
hdf5-metno-sys = { version = "0.11.4", optional = true }

[features]
default = []
hdf5 = ["dep:hdf5-metno", "dep:hdf5-metno-sys"]

[dev-dependencies]
tempfile.workspace = true
