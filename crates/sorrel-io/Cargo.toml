[package]
name = "sorrel-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Data providers and file-format backends for Sorrel spike-sorting data."

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
memmap2.workspace = true
bytemuck.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
flate2.workspace = true
log.workspace = true
dunce = "1"

# Optional HDF5 backend for NWB and Kilosort 4 `rez.mat` (MATLAB v7.3 = HDF5).
# Off by default: pulls libhdf5 in as a system dependency. Enable with
# `--features hdf5`. We use the actively-maintained `hdf5-metno` fork
# (vs. the upstream-stale `hdf5` crate), which supports libhdf5 ≥ 1.14.
hdf5-metno = { version = "0.12.4", optional = true }
hdf5-metno-sys = { version = "0.11.3", optional = true }
num-traits = { version = "0.2", optional = true }
lz4_flex = { version = "0.12.3", optional = true, default-features = false, features = [
  "std",
  "safe-decode",
] }
ruzstd = { version = "0.9.1", optional = true }
snap = { version = "1.1", optional = true }
# ponytail: drop the local path when the upstream libz-sys fix ships on crates.io.
zarrs = { version = "0.23.14", path = "../../vendor/zarrs", optional = true, default-features = false, features = [
  "filesystem",
  "gzip",
  "transpose",
  "zlib",
] }
jiff = { version = "0.2", default-features = false, optional = true }

[features]
default = []
hdf5 = ["dep:hdf5-metno", "dep:hdf5-metno-sys", "dep:jiff"]
zarr = [
  "dep:zarrs",
  "dep:num-traits",
  "dep:jiff",
  "dep:lz4_flex",
  "dep:ruzstd",
  "dep:snap",
]

[dev-dependencies]
tempfile.workspace = true
