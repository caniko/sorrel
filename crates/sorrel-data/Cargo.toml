[package]
name = "sorrel-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Generic curation session, journal, persistence, and analysis state for Sorrel."

[dependencies]
sorrel-io.workspace = true
sorrel-compute.workspace = true
sorrel-cache.workspace = true
rayon.workspace = true
anyhow.workspace = true
thiserror.workspace = true
blake3.workspace = true
serde.workspace = true
rkyv.workspace = true
rmp-serde.workspace = true
serde_json.workspace = true
toml.workspace = true
xxhash-rust.workspace = true
log.workspace = true

[features]
default = ["phy-export"]
# Write a complete phy template-gui directory from any backend (`export_phy`).
phy-export = []
# Forwarded to sorrel-io: enables HDF5-backed NWB and KS4 rez.mat readers.
hdf5 = ["sorrel-io/hdf5"]

[[bench]]
name = "seed_amplitudes_cache"
harness = false

[dev-dependencies]
tempfile.workspace = true
