[[pages.sections]]
type = "content"
id = "workflow"
heading = "One selection. Every view."
html = '''
<p>Brush a group of spikes and follow it through waveforms, feature space and time. The evidence stays connected while you decide what belongs together.</p>
<div class="screenshots-grid">
  <figure class="screenshot-slot">
    <a href="/showcase/hero-still.webp" class="lightbox-trigger" aria-label="View linked selections" data-lightbox-image="/showcase/hero-loop.webp" data-lightbox-still="/showcase/hero-still.webp" data-lightbox-alt="The same spikes highlighted across waveforms, feature plots, 3D space and the time brush." data-lightbox-caption="Linked selections across waveforms and features.">
      <img src="/showcase/hero-still.webp" alt="The same spikes highlighted across waveforms, feature plots, 3D space and the time brush." width="1824" height="1040" loading="lazy">
      <span class="lightbox-cue">View linked selections</span>
    </a>
    <figcaption>The viewer plays the linked-selection sequence; with reduced motion it shows this still.</figcaption>
  </figure>
</div>
<!-- Plinth's lightbox opens the image but leaves the anchor's href to navigate; cancel it here until Plinth ships the fix. The href stays for the no-JS fallback. -->
<script>document.addEventListener('click', event => { if (event.target.closest('a[data-lightbox-image]')) event.preventDefault(); });</script>
'''

[[pages.sections]]
type = "screenshot_grid"
id = "gallery"
heading = "Look closer. Make the call."
intro = "Explore the tools behind a curation decision. These are Sorrel's own UI-test states, composed in OpenPencil—not mock interfaces. Select any image to enlarge it."

[[pages.sections.screenshots]]
src = "/showcase/gallery-3d.webp"
alt = "A 3D feature space: two clusters as point clouds inside a wireframe cube, a lasso prism around a brushed group, and the list of candidate third axes"
caption = "3D feature space: orbit the clusters, pick a third axis, and lasso a prism through them"

[[pages.sections.screenshots]]
src = "/showcase/gallery-kmeans.webp"
alt = "A k-means split of one cluster into numbered parts, with a collision matrix showing how much the parts overlap"
caption = "K-means split with a collision matrix, so you see overlap before you commit"

[[pages.sections.screenshots]]
src = "/showcase/gallery-isi-whatif.webp"
alt = "Waveforms of a proposed split beside an ISI histogram that shows the inside and outside groups separately"
caption = "ISI what-if: see how a split changes refractory violations before you make it"

[[pages.sections.screenshots]]
src = "/showcase/gallery-probe.webp"
alt = "A probe map of 16 channels with two selected channels marked A and B, beside the feature navigator"
caption = "Probe map and feature navigator: click channels, see their features"

[[pages.sections.screenshots]]
src = "/showcase/gallery-proposals.webp"
alt = "The proposals pane with an agent's merge and relabel suggestions, each with its evidence and Accept and Reject buttons"
caption = "Agent proposals arrive with their evidence, and nothing changes until you accept"

[[pages.sections.screenshots]]
src = "/showcase/gallery-history.webp"
alt = "The History pane showing a branching curation journal with entries from you and an agent"
caption = "Branching history: go back to any point, and nothing is ever discarded"

[[pages.sections]]
type = "feature_grid"
id = "features"
heading = "Built for curation work"

[[pages.sections.features]]
title = "Linked views, one decision"
description = "Trace, raster, ISI, CCG, waveform, template, feature, drift, probe, similarity and quality views share a selection, so every merge, split and label is checked against the same spikes."

[[pages.sections.features]]
title = "Review agent proposals"
description = "Agents connect over MCP and can propose relabels, merges and splits with confidence and reasons. In Direct mode their edits are journaled and undoable; in Propose mode nothing changes until you accept."

[[pages.sections.features]]
title = "A journal that keeps every edit"
description = "Every edit from you, an agent or an algorithm lands in a branching journal before the session moves. Undo walks back; editing after undo branches instead of discarding. The tree survives save and reopen."

[[pages.sections.features]]
title = "Optional GPU trace processing"
description = "wgpu kernels for common-median referencing, high-pass filtering and mean-snippet extraction share the renderer's device and queue. Without a GPU adapter, the trace path falls back to the CPU implementations; headless QC uses them directly."

[[pages.sections.features]]
title = "Headless QC export"
description = "sorrel qc DIR --out DIR runs firing rate, presence, refractory contamination, amplitude stats, ISI violations, isolation distance where PC features exist, and composite quality, writing cluster_qc.tsv and cluster_qc.json without a window."

[[pages.sections.features]]
title = "Python bridge"
description = "sorrel.open(recording, sorting) builds a SortingAnalyzer and launches the native GUI; sorrel.Session.open(\"my_run/phy\") edits the same journal from a notebook, with the same save and undo history."

[[pages.sections]]
type = "content"
id = "backends"
heading = "Reads what you already have"
html = '''
<p>Point <code>sorrel open</code> at the sorting directory you already have; it detects the backend from the files inside.</p>
<details>
  <summary>phy / Kilosort <span>spike_times.npy · spike_clusters.npy · params.py</span></summary>
  <p>A directory of <code>spike_times.npy</code>, <code>spike_clusters.npy</code> and <code>params.py</code>, plus optional <code>templates</code>, PC features, amplitudes, <code>channel_positions</code>, <code>similar_templates</code> and quality-metric sidecars — read exactly as phy does.</p>
</details>
<details>
  <summary>SpikeInterface <span>SortingAnalyzer · binary_folder</span></summary>
  <p>A SortingAnalyzer saved as <code>binary_folder</code>: <code>recording.json</code>, the flat sorting under <code>sorting/</code>, an optional <code>probe.json</code>, and the <code>quality_metrics</code> extension.</p>
</details>
<details>
  <summary>NWB &amp; Kilosort 4 rez <span>*.nwb · rez.mat · --features hdf5</span></summary>
  <p><code>*.nwb</code> via <code>/units/spike_times</code> and the electrodes table; <code>rez.mat</code> via <code>rez/st3</code> and <code>rez/ops</code>. Both are gated behind <code>--features hdf5</code>. Without it, open the phy export KS4 writes under <code>&lt;output&gt;/phy/</code>.</p>
</details>
<details>
  <summary>Raw recording sources <span>SpikeGLX · Open Ephys · MDA</span></summary>
  <p>SpikeGLX <code>.bin</code> + <code>.meta</code>, Open Ephys <code>continuous.dat</code> + <code>structure.oebin</code>, and Mountainsort MDA plug in via <code>--dat</code>, <code>--spikeglx-meta</code> and <code>--oebin</code>.</p>
</details>
'''

[[pages.sections]]
type = "install"
id = "install"
heading = "Install"
intro = "Prebuilt binaries for Linux, macOS and Windows (x64 and ARM64) on every release, or one pip command for the GUI and Python API. Point Sorrel at a sorting directory (sorrel open my_run/phy) and it detects the backend."
guide_href = "/docs/getting-started/installation.html"

[[pages.sections.primary_routes]]
label = "Choose your download"
audience = "Linux (AppImage, tar.gz), macOS (Apple silicon), Windows (x64, ARM64)"
href = "/download/#downloads"

[[pages.sections.primary_routes]]
label = "Python"
audience = "Linux x86_64 / ARM64, macOS ARM64, Windows x64 · Python 3.8+"
href = "/docs/getting-started/installation.html#python"
command = "pip install sorrel-ephys"
recommended = true

[[pages.sections.secondary_routes]]
label = "Build from source"
audience = "Cargo, all platforms"
href = "/docs/getting-started/installation.html#with-cargo"
command = "cargo build --release -p sorrel"

