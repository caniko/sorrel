[workspace]
resolver = "2"
members = [
  "crates/sorrel-io",
  "crates/sorrel-cache",
  "crates/sorrel-compute",
  "crates/sorrel-gpu",
  "crates/sorrel-data",
  "crates/sorrel-render",
  "crates/sorrel-ui",
  "crates/sorrel-remote",
  "crates/sorrel",
]
# `crates/sorrel-py` is intentionally excluded — it requires PyO3/maturin
# at build time and ships its own (single-member) workspace declaration so
# `cargo check` from the root never recurses into it.
exclude = ["crates/sorrel-py"]

[workspace.package]
version = "0.2.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/caniko/sorrel"

[workspace.metadata.crane]
name = "sorrel"

[workspace.dependencies]
sorrel-io = { version = "0.2.1", path = "crates/sorrel-io" }
sorrel-cache = { version = "0.2.1", path = "crates/sorrel-cache" }
sorrel-compute = { version = "0.2.1", path = "crates/sorrel-compute" }
sorrel-gpu = { version = "0.2.1", path = "crates/sorrel-gpu" }
# Default features off so `sorrel --no-default-features` really drops `phy-export`.
sorrel-data = { version = "0.2.1", path = "crates/sorrel-data", default-features = false }
sorrel-render = { version = "0.2.1", path = "crates/sorrel-render" }
sorrel-ui = { version = "0.2.1", path = "crates/sorrel-ui" }
sorrel-remote = { version = "0.2.1", path = "crates/sorrel-remote" }

anyhow = "1"
thiserror = "1"
blake3 = "1"
bytemuck = { version = "1", features = ["derive"] }
memmap2 = "0.9"
rkyv = { version = "0.8", default-features = false, features = [
  "alloc",
  "bytecheck",
  "little_endian",
  "pointer_width_64",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
flate2 = "1"
wgpu = "29.0.3"
egui = "0.34.2"
eframe = { version = "0.34.2", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "wgpu",
] }
egui_extras = "0.34.2"
egui-wgpu = "0.34.2"
egui_tiles = "0.15"
egui_kittest = { version = "0.34.2", features = ["eframe", "wgpu", "snapshot"] }
tempfile = "3"
rayon = "1"
pollster = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
debug = false

[profile.dev.package."*"]
opt-level = 2
