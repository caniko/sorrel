---
# yamllint disable rule:line-length
# Generated by simit. Manual edits will be reported as ci=drift.
# Required secrets and variables:
# - GITHUB_TOKEN: hosted release API token for release creation and asset upload.
# - MINISIGN_SECRET_KEY, MINISIGN_PASSWORD: minisign signing of SHA256SUMS.txt.
# - COSIGN_PRIVATE_KEY, COSIGN_PASSWORD: optional fallback when keyless Sigstore OIDC is unavailable.
# - HARBOR_MACOS_SDK_NETRC: netrc for private Nix substituters.
# - CHOCOLATEY_API_KEY: optional Chocolatey push API key (env CHOCOLATEY_API_KEY).
# - WINGET_PAT: optional GitHub PAT for winget-pkgs PRs.
# - ATTIC_TOKEN: repository secret for native prebuild Attic publication.

name: release

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    permissions:
      contents: read
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure Nix substituter credentials
        env:
          SIMIT_NIX_NETRC: ${{ secrets.HARBOR_MACOS_SDK_NETRC }}
        run: |
          umask 077
          printf '%s\n' "$SIMIT_NIX_NETRC" > "$RUNNER_TEMP/simit-nix-netrc"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://attic.candee.baby/harbor-macos-sdk https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= harbor-macos-sdk:MLRX9qZASKwDh48UWON67cvYxfEbqvjfIZQmGwt1v1E= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            netrc-file = ${{ runner.temp }}/simit-nix-netrc

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          event_sha="${GITHUB_SHA:-${FORGE_SHA:-${FORGEJO_SHA:-}}}"
          test -n "$event_sha" && test "$validated_sha" = "$event_sha" && test "$checkout_sha" = "$event_sha" || { echo "Signed tag commit does not match the immutable event checkout" >&2; exit 1; }
          git worktree add --detach "$tag_worktree" "$validated_sha"
          test "$(nix eval --raw "$tag_worktree#sorrel.version")" = "$VERSION"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
  prebuild:
    needs: validate
    uses: ./.github/workflows/prebuild.yaml
    with:
      release: true
    secrets:
      attic_token: ${{ secrets.ATTIC_TOKEN }}
      HARBOR_MACOS_SDK_NETRC: ${{ secrets.HARBOR_MACOS_SDK_NETRC }}
  release:
    needs: [validate, prebuild]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Configure Nix substituter credentials
        env:
          SIMIT_NIX_NETRC: ${{ secrets.HARBOR_MACOS_SDK_NETRC }}
        run: |
          umask 077
          printf '%s\n' "$SIMIT_NIX_NETRC" > "$RUNNER_TEMP/simit-nix-netrc"
      - uses: cachix/install-nix-action@ba0dd844c9180cbf77aa72a116d6fbc515d0e87b # v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
            substituters = https://attic.candee.baby/canix https://attic.candee.baby/harbor-macos-sdk https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= harbor-macos-sdk:MLRX9qZASKwDh48UWON67cvYxfEbqvjfIZQmGwt1v1E= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            netrc-file = ${{ runner.temp }}/simit-nix-netrc

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${FORGEJO_REF_NAME:-}}}"
          if [ -z "$VERSION" ]; then ref="${GITHUB_REF:-${FORGE_REF:-${FORGEJO_REF:-}}}"; VERSION="${ref#refs/tags/}"; fi
          TAG="$VERSION"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)\.[0-9]+)?$'
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          git_fetch --force --tags origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_worktree="$(mktemp -d)"
          rmdir "$tag_worktree"
          cleanup_validation() {
            if [ -n "${tag_worktree:-}" ]; then git worktree remove --force "$tag_worktree" >/dev/null 2>&1 || rm -rf "$tag_worktree"; fi
            if [ -n "${GNUPGHOME:-}" ]; then rm -rf "$GNUPGHOME"; fi
          }
          trap cleanup_validation EXIT
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"
          git verify-tag "$TAG"
          signed_tag_name="$(git cat-file tag "refs/tags/$TAG" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$TAG" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${TAG}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          event_sha="${GITHUB_SHA:-${FORGE_SHA:-${FORGEJO_SHA:-}}}"
          test -n "$event_sha" && test "$validated_sha" = "$event_sha" && test "$checkout_sha" = "$event_sha" || { echo "Signed tag commit does not match the immutable event checkout" >&2; exit 1; }
          git worktree add --detach "$tag_worktree" "$validated_sha"
          test "$(nix eval --raw "$tag_worktree#sorrel.version")" = "$VERSION"
          if ! grep -q "^## \[$VERSION\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]" "$tag_worktree/CHANGELOG.md"; then
            echo "CHANGELOG.md missing section for $VERSION" >&2
            exit 1
          fi

          IS_PRERELEASE=false
          if printf '%s\n' "$VERSION" | grep -Eq -- '-(rc|beta|alpha)\.[0-9]+$'; then IS_PRERELEASE=true; fi

          git checkout --detach "$validated_sha"
          { printf 'TAG=%s\n' "$TAG"; printf 'VERSION=%s\n' "$VERSION"; printf 'IS_PRERELEASE=%s\n' "$IS_PRERELEASE"; } > release-env
      - name: Generate release notes
        run: |
          set -euo pipefail
          . ./release-env
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\] - [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]$" { found = 1; print; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
      - name: Check release credentials
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          HARBOR_MACOS_SDK_NETRC: ${{ secrets.HARBOR_MACOS_SDK_NETRC }}
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -euo pipefail
          . ./release-env
          missing=''
          require_credential() {
            scope="$1"; name="$2"; value="$3"
            if [ -z "$value" ]; then missing="$(printf '%s\n  - %s %s' "$missing" "$scope" "$name")"; fi
          }
          require_credential 'global/user secret' 'GITHUB_TOKEN' "${GITHUB_TOKEN:-}"
          require_credential 'repo secret' 'MINISIGN_SECRET_KEY' "${MINISIGN_SECRET_KEY:-}"
          require_credential 'repo secret' 'MINISIGN_PASSWORD' "${MINISIGN_PASSWORD:-}"
          require_credential 'repo secret' 'HARBOR_MACOS_SDK_NETRC' "${HARBOR_MACOS_SDK_NETRC:-}"
          require_credential 'repo secret' 'ATTIC_TOKEN' "${ATTIC_TOKEN:-}"
          if [ -n "$missing" ]; then
            printf 'Missing release credentials:%s\n' "$missing" >&2
            exit 1
          fi
          test -s keys/minisign.pub
          umask 077
          minisign_key="$(mktemp)"; minisign_probe="$(mktemp)"; minisign_sig="${minisign_probe}.minisig"
          trap 'rm -f "$minisign_key" "$minisign_probe" "$minisign_sig"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf 'simit release credentials probe\n' > "$minisign_probe"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m "$minisign_probe" -x "$minisign_sig"
          nix shell nixpkgs#minisign -c minisign -V -m "$minisign_probe" -x "$minisign_sig" -p keys/minisign.pub
      - name: Build release artifacts
        run: |
          set -euo pipefail
          . ./release-env
          export TAG VERSION IS_PRERELEASE
          mkdir -p release
          df -h /
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          test "$free_kib" -ge 8388608 || { echo "GitHub runner has less than 8 GiB free before Nix realization" >&2; exit 1; }
          mkdir -p target
          echo 'disk before bundle release-bundle'
          df -h /
          nix build '.#release-bundle' --out-link 'target/simit-release-bundle-0'
          test -d 'target/simit-release-bundle-0'
          while IFS= read -r file; do
            name="$(basename "$file")"
            test ! -e "release/$name" || { echo "release bundle asset collision: $name" >&2; exit 1; }
            cp -L "$file" "release/$name"
          done < <(find -L 'target/simit-release-bundle-0' -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort)
          echo 'disk after bundle release-bundle'
          df -h /
          shopt -s nullglob
          manifests=(release/*-release-manifest.json)
          test "${#manifests[@]}" -eq 1 || { echo "expected exactly one release manifest from Nix bundles" >&2; exit 1; }
          jq -e --arg version "$VERSION" '(.schemaVersion == 2) and (.version == $version) and (.artifacts | length > 0)' "${manifests[0]}" >/dev/null
          git archive --format=tar --prefix="sorrel-$VERSION/" HEAD | gzip -n > "release/sorrel-$VERSION.tar.gz"
          rm -f target/simit-release-bundle-*
          nix store gc
          df -h /
          free_kib="$(df -Pk / | awk 'NR == 2 { print $4 }')"
          test "$free_kib" -ge 2097152 || { echo "GitHub runner has less than 2 GiB free before release publication" >&2; exit 1; }
      - name: Generate release checksums
        run: |
          set -euo pipefail
          cd release
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches '*.tar.gz'
          add_matches '*.zip'
          add_matches '*.AppImage'
          add_matches '*.whl'
          : > SHA256SUMS.txt
          count=0
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            [ "$file" != SHA256SUMS.txt ] || continue
            sha256sum "$file" >> SHA256SUMS.txt
            count=$((count + 1))
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          test "$count" -gt 0
          test -s SHA256SUMS.txt
      - name: Sign checksums and attest release artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          set -euo pipefail
          . ./release-env
          test -s keys/minisign.pub
          test -n "${MINISIGN_SECRET_KEY:-}"
          test -n "${MINISIGN_PASSWORD:-}"
          umask 077
          minisign_key="$(mktemp)"; oidc_token="$(mktemp)"; cosign_key="$(mktemp)"; export oidc_token cosign_key
          trap 'rm -f "$minisign_key" "$oidc_token" "$cosign_key"' EXIT
          printf '%s' "$MINISIGN_SECRET_KEY" > "$minisign_key"
          printf '%s\n' "$MINISIGN_PASSWORD" | \
            nix shell nixpkgs#minisign -c minisign -S -s "$minisign_key" -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig
          nix shell nixpkgs#minisign -c minisign -V -m release/SHA256SUMS.txt -x release/SHA256SUMS.txt.minisig -p keys/minisign.pub

          nix shell nixpkgs#cosign nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          repo_url="https://github.com/caniko/sorrel"
          git_sha="$(git rev-parse HEAD)"
          workflow_sha="$(sha256sum .github/workflows/release.yml | awk '{print $1}')"
          flake_lock_sha="missing"; if [ -f flake.lock ]; then flake_lock_sha="$(sha256sum flake.lock | awk '{print $1}')"; fi
          builder_id="${repo_url}/blob/${TAG}/.github/workflows/release.yml"
          sign_blob_keyless() { file="$1"; if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] && [ -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then curl -fsSL -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sigstore" | jq -er '.value' > "$oidc_token"; cosign sign-blob --yes --identity-token "$(cat "$oidc_token")" --bundle "${file}.cosign.bundle" "$file"; else return 1; fi; }
          attest_blob_keyless() { file="$1"; predicate="$2"; if [ -s "$oidc_token" ]; then cosign attest-blob --yes --identity-token "$(cat "$oidc_token")" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; else return 1; fi; }
          sign_blob_with_key() { file="$1"; test -n "${COSIGN_PRIVATE_KEY:-}"; printf '%s' "$COSIGN_PRIVATE_KEY" > "$cosign_key"; cosign sign-blob --yes --key "$cosign_key" --bundle "${file}.cosign.bundle" "$file"; }
          attest_blob_with_key() { file="$1"; predicate="$2"; cosign attest-blob --yes --key "$cosign_key" --predicate "$predicate" --type slsaprovenance1 --bundle "${file}.intoto.bundle" "$file"; }
          shopt -s nullglob
          files=(release/*.tar.gz release/*.zip release/*.AppImage release/*.deb release/*.src.rpm release/*.exe)
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            artifact_sha="$(sha256sum "$file" | awk '{print $1}')"; predicate="$(mktemp)"
            jq -n --arg builder_id "$builder_id" --arg git_sha "$git_sha" --arg workflow_sha "$workflow_sha" --arg flake_lock_sha "$flake_lock_sha" --arg repo_url "$repo_url" --arg ref "refs/tags/${TAG}" --arg artifact "$(basename "$file")" --arg artifact_sha "$artifact_sha" '{buildDefinition:{buildType:"https://simit.rs/release",externalParameters:{repository:$repo_url,ref:$ref,artifact:$artifact,artifactDigest:{sha256:$artifact_sha}},internalParameters:{},resolvedDependencies:[{uri:($repo_url+".git"),digest:{gitCommit:$git_sha}},{uri:"flake.lock",digest:{sha256:$flake_lock_sha}},{uri:"release workflow",digest:{sha256:$workflow_sha}}]},runDetails:{builder:{id:$builder_id}}}' > "$predicate"
            if sign_blob_keyless "$file" && attest_blob_keyless "$file" "$predicate"; then echo "signed+attested $file (keyless)"; elif [ -n "${COSIGN_PRIVATE_KEY:-}" ]; then echo "keyless failed for $file; using COSIGN_PRIVATE_KEY"; sign_blob_with_key "$file"; attest_blob_with_key "$file" "$predicate"; else echo "::error::keyless Sigstore failed and COSIGN_PRIVATE_KEY is unset for $file" >&2; exit 1; fi
            test -s "${file}.cosign.bundle"
            test -s "${file}.intoto.bundle"
            rm -f "$predicate"
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Run release smoke checks
        run: |
          set -euo pipefail
          . ./release-env
          mkdir -p release
          nix run .#release-smoke -- "$VERSION" release
      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_API: https://api.github.com
          GITHUB_REPO: caniko/sorrel
        run: |
          set -euo pipefail
          test -n "$GITHUB_TOKEN"
          . ./release-env
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT'
          set -euo pipefail
          . ./release-env
          release_payload=$(jq -n --arg tag "$TAG" --arg name "$TAG" --arg branch "trunk" --argjson prerelease "$IS_PRERELEASE" --rawfile body release-notes.md '{tag_name: $tag, target_commitish: $branch, name: $name, body: $body, draft: false, prerelease: $prerelease}')
          status=$(curl -sS -o release.json -w '%{http_code}' -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'X-GitHub-Api-Version: 2022-11-28' -d "$release_payload" "$GITHUB_API/repos/$GITHUB_REPO/releases")
          if [ "$status" = "409" ] || [ "$status" = "422" ]; then
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/tags/$TAG" > release.json
          elif [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then cat release.json; exit 1; fi
          release_id=$(jq -r '.id' release.json); test "$release_id" != "null"
          upload_url=$(jq -r '.upload_url' release.json | cut -d '{' -f 1); test -n "$upload_url"
          shopt -s nullglob
          files=()
          add_matches() { local pattern="$1" match; while IFS= read -r match; do files+=("$match"); done < <(compgen -G "$pattern" || true); }
          add_matches 'release/SHA256SUMS.txt'
          add_matches 'release/SHA256SUMS.txt.minisig'
          add_matches 'release/*.cosign.bundle'
          add_matches 'release/*.intoto.bundle'
          add_matches 'release/*.tar.gz'
          add_matches 'release/*.zip'
          add_matches 'release/*.AppImage'
          add_matches 'release/*.whl'
          while IFS= read -r file; do
            [ -f "$file" ] || continue
            name=$(basename "$file")
            asset_id=$(curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/$release_id/assets" | jq -r --arg name "$name" '.[] | select(.name == $name) | .id' | head -n 1)
            if [ -n "$asset_id" ]; then curl -sS --fail -X DELETE -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' "$GITHUB_API/repos/$GITHUB_REPO/releases/assets/$asset_id"; fi
            curl -sS --fail -H "Authorization: Bearer $GITHUB_TOKEN" -H 'Accept: application/vnd.github+json' -H 'Content-Type: application/octet-stream' --data-binary "@$file" "$upload_url?name=$name" > /dev/null
          done < <(printf '%s\n' "${files[@]}" | LC_ALL=C sort -u)
          SCRIPT
      - name: Probe downstream publisher state
        run: |
          set -euo pipefail
          . ./release-env
          : > release-publisher-state.env
          write_state() {
            channel="$1"; state="$2"; detail="$3"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            printf '%s=%s\n' "$var" "$state" >> release-publisher-state.env
            printf '%-10s %s %s\n' "$channel" "$state" "$detail"
          }
          public_git_url() {
            case "$1" in
              ssh://git@codeberg.org/*) path="${1#ssh://git@codeberg.org/}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              git@codeberg.org:*) path="${1#git@codeberg.org:}"; printf 'https://codeberg.org/%s\n' "$path" ;;
              ssh://git@codefloe.com/*) path="${1#ssh://git@codefloe.com/}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              git@codefloe.com:*) path="${1#git@codefloe.com:}"; printf 'https://codefloe.com/%s\n' "$path" ;;
              ssh://git@github.com/*) path="${1#ssh://git@github.com/}"; printf 'https://github.com/%s\n' "$path" ;;
              git@github.com:*) path="${1#git@github.com:}"; printf 'https://github.com/%s\n' "$path" ;;
              *) printf '%s\n' "$1" ;;
            esac
          }
          probe_git_file() {
            repo="$1"; ref="$2"; path="$3"
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path"
          }
          probe_git_tree() {
            repo="$1"; ref="$2"; path_a="$3"; path_b="$4"; tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            git clone --depth 1 --branch "$ref" "$(public_git_url "$repo")" "$tmp/repo" >/dev/null 2>&1 && test -e "$tmp/repo/$path_a" && test -e "$tmp/repo/$path_b"
          }
          active_or_soft() {
            channel="$1"; detail="$2"; shift 2
            if "$@"; then write_state "$channel" active-required "$detail"; else write_state "$channel" inactive-soft "$detail"; fi
          }
          stable_or_state() {
            channel="$1"; detail="$2"; shift 2
            if [ "$IS_PRERELEASE" = "true" ]; then write_state "$channel" skipped-prerelease "$detail"; else active_or_soft "$channel" "$detail" "$@"; fi
          }
          write_state apt not-configured '-'
          write_state aur not-configured '-'
          write_state copr not-configured '-'
          CHOCO_FILTER="$(printf '%s' 'Id eq '\''sorrel'\'' and IsLatestVersion' | jq -sRr @uri)"
          export CHOCO_FILTER
          # Expand the filter in the child shell.
          # shellcheck disable=SC2016
          stable_or_state chocolatey 'sorrel' bash -c 'curl -fsSL "https://community.chocolatey.org/api/v2/Packages()?%24filter=${CHOCO_FILTER}" | grep -q "<entry>"'
          write_state homebrew not-configured '-'
          write_state scoop not-configured '-'
          pypi_wheels=(release/*.whl); pypi_name="${pypi_wheels[0]##*/}"; pypi_name="${pypi_name%%-*}"
          active_or_soft pypi "$pypi_name" curl -fsS -o /dev/null "https://pypi.org/pypi/${pypi_name}/json"
          write_state flathub not-configured '-'
          winget_code="$(curl -sS -o /dev/null -w '%{http_code}' 'https://api.github.com/repos/microsoft/winget-pkgs/contents/manifests/c/Caniko/Sorrel' || true)"
          case "$winget_code" in 200) winget_state=active-required ;; 404) winget_state=inactive-soft ;; *) winget_state=probe-failed ;; esac
          if [ "$IS_PRERELEASE" = "true" ]; then winget_state=skipped-prerelease; fi
          write_state winget "$winget_state" 'Caniko.Sorrel'
      - name: Publish winget manifest PR
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping winget manifest update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${WINGET_PAT:-}" ]; then publisher_missing winget 'WINGET_PAT unset'; fi
          ZIP_NAME="sorrel-${VERSION}-x86_64-windows.zip"; ZIP_URL="https://github.com/caniko/sorrel/releases/download/${TAG}/${ZIP_NAME}"
          test -s "release/${ZIP_NAME}" || publisher_missing winget "missing release/${ZIP_NAME}"
          export ZIP_NAME ZIP_URL VERSION WINGET_PAT PUBLISH_WINGET_STATE
          case "${PUBLISH_WINGET_STATE:-}" in active-required|inactive-soft) ;; *) echo "::error::winget: winget-pkgs probe was inconclusive (${PUBLISH_WINGET_STATE:-unset}); not guessing between a new version and a first submission." >&2; exit 1 ;; esac
          nix shell nixpkgs#curl nixpkgs#jq -c bash <<'SCRIPT' || publisher_missing winget 'GitHub API submission failed'
          set -euo pipefail
          tmpdir="$(mktemp -d)"; trap 'rm -rf "$tmpdir"' EXIT
          ID='Caniko.Sorrel'; MANIFEST_DIR='manifests/c/Caniko/Sorrel'; state="${PUBLISH_WINGET_STATE:-}"
          # yaml(): double-quoted YAML scalar; f KEY VALUE writes one field.
          yaml() { local s="${1//\\/\\\\}"; printf '"%s"' "${s//\"/\\\"}"; }
          f() { printf '%s: %s\n' "$1" "$(yaml "$2")"; }
          dir="$tmpdir/"'manifests/c/Caniko/Sorrel'"/$VERSION"; mkdir -p "$dir"
          sha="$(sha256sum "release/${ZIP_NAME}" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')"
          { f PackageIdentifier 'Caniko.Sorrel'; f PackageVersion "$VERSION"; echo 'DefaultLocale: en-US'; echo 'ManifestType: version'; echo 'ManifestVersion: 1.10.0'; } > "$dir"/'Caniko.Sorrel'.yaml
          { f PackageIdentifier 'Caniko.Sorrel'; f PackageVersion "$VERSION"; echo 'InstallerType: zip'; echo 'NestedInstallerType: portable'; echo 'NestedInstallerFiles:'; printf '%s\n' "- RelativeFilePath: $(yaml 'sorrel.exe')" "  PortableCommandAlias: $(yaml 'sorrel')"; echo 'Installers:'; echo '- Architecture: x64'; printf '%s\n' "  InstallerUrl: $(yaml "$ZIP_URL")" "  InstallerSha256: $sha"; echo 'ManifestType: installer'; echo 'ManifestVersion: 1.10.0'; } > "$dir"/'Caniko.Sorrel'.installer.yaml
          { f PackageIdentifier 'Caniko.Sorrel'; f PackageVersion "$VERSION"; echo 'PackageLocale: en-US'; f Publisher 'Caniko'; f PackageName 'Sorrel'; f License 'MIT OR Apache-2.0'; f LicenseUrl 'https://github.com/caniko/sorrel/blob/trunk/LICENSE-MIT'; f ShortDescription 'Native GUI for curating spike-sorted electrophysiology data'; echo 'ManifestType: defaultLocale'; echo 'ManifestVersion: 1.10.0'; } > "$dir"/'Caniko.Sorrel'.locale.en-US.yaml
          # Submit the manifests in "$dir" to microsoft/winget-pkgs through the GitHub
          # REST API as the WINGET_PAT user. Needs curl and jq.
          # Inputs: ID MANIFEST_DIR VERSION ZIP_URL WINGET_PAT, state (active-required when
          # the package already exists upstream) and dir (the generated manifest files).
          UP=microsoft/winget-pkgs
          umask 077
          # The token reaches curl through this 0600 header file, never through argv.
          printf 'Authorization: Bearer %s\n' "$WINGET_PAT" > "$tmpdir/auth"
          printf '{}' > "$tmpdir/empty.json"
          code=; last=
          # api METHOD PATH [BODYFILE]: body lands in $tmpdir/resp, status in $code, non-2xx returns 1.
          api() {
            local a=(-sS --retry 3 -o "$tmpdir/resp" -w '%{http_code}' -X "$1"
              -H "@$tmpdir/auth" -H 'Accept: application/vnd.github+json'
              -H 'X-GitHub-Api-Version: 2022-11-28' -H 'Content-Type: application/json')
            [ -z "${3:-}" ] || a+=(--data-binary "@$3")
            last="$1 $2"
            code="$(curl "${a[@]}" "https://api.github.com$2")" || code=000
            case "$code" in 2??) ;; *) return 1 ;; esac
          }
          fail() { echo "::error::winget: $last -> HTTP $code: $(jq -r '.message // empty' "$tmpdir/resp" 2>/dev/null)" >&2; exit 1; }
          must() { api "$@" || fail; }
          val() { jq -r "$1" "$tmpdir/resp"; }

          # Nothing to do when this version is already upstream.
          api GET "/repos/$UP/contents/$MANIFEST_DIR/$VERSION" || true
          case "$code" in
            200) echo "winget: $ID $VERSION is already published in $UP"; exit 0 ;;
            404) ;;
            *) fail ;;
          esac
          # New package or new version: the package directory decides.
          if [ -z "$state" ]; then
            api GET "/repos/$UP/contents/$MANIFEST_DIR" || true
            case "$code" in 200) state=active-required ;; 404) state=inactive-soft ;; *) fail ;; esac
          fi
          if [ "$state" = active-required ]; then kind='New version'; else kind='New package'; fi
          title="$kind: $ID version $VERSION"

          must GET /user; login="$(val .login)"
          must GET "/repos/$UP"; base="$(val .default_branch)"
          branch="$(printf '%s-%s' "$ID" "$VERSION" | tr -c 'A-Za-z0-9._-' '-')"
          # A rerun with the PR still open is a success.
          must GET "/repos/$UP/pulls?head=$login:$branch&state=open"
          pr="$(val '.[0].html_url // empty')"
          if [ -n "$pr" ]; then echo "winget: PR already open: $pr"; exit 0; fi

          # POST /forks is idempotent; the fork can take a while to appear.
          must POST "/repos/$UP/forks" "$tmpdir/empty.json"
          fork="/repos/$login/winget-pkgs"
          n=0
          until api GET "$fork"; do
            n=$((n + 1))
            [ "$n" -lt 24 ] || { echo "::error::winget: fork $login/winget-pkgs did not appear within 2 minutes" >&2; exit 1; }
            sleep 5
          done

          must GET "/repos/$UP/git/ref/heads/$base"; head="$(val .object.sha)"
          must GET "/repos/$UP/git/commits/$head"; base_tree="$(val .tree.sha)"
          # A lagging fork may not have the upstream commit yet; sync it first.
          api GET "$fork/git/commits/$head" || {
            jq -n --arg b "$base" '{branch: $b}' > "$tmpdir/b"
            must POST "$fork/merge-upstream" "$tmpdir/b"
          }

          # One commit holding the three manifests: blobs -> tree on the upstream tree -> commit -> ref.
          entries='[]'
          for f in "$dir"/*.yaml; do
            jq -n --rawfile c "$f" '{content: $c, encoding: "utf-8"}' > "$tmpdir/b"
            must POST "$fork/git/blobs" "$tmpdir/b"
            entries="$(jq -c --arg p "$MANIFEST_DIR/$VERSION/${f##*/}" --arg s "$(val .sha)" \
              '. + [{path: $p, mode: "100644", type: "blob", sha: $s}]' <<<"$entries")"
          done
          jq -n --arg b "$base_tree" --argjson e "$entries" '{base_tree: $b, tree: $e}' > "$tmpdir/b"
          must POST "$fork/git/trees" "$tmpdir/b"; tree="$(val .sha)"
          jq -n --arg m "$title" --arg t "$tree" --arg p "$head" '{message: $m, tree: $t, parents: [$p]}' > "$tmpdir/b"
          must POST "$fork/git/commits" "$tmpdir/b"; commit="$(val .sha)"
          jq -n --arg r "refs/heads/$branch" --arg s "$commit" '{ref: $r, sha: $s}' > "$tmpdir/b"
          api POST "$fork/git/refs" "$tmpdir/b" || {
            [ "$code" != 422 ] && fail
            # The branch survives from an earlier run whose PR was closed: move it.
            jq -n --arg s "$commit" '{sha: $s, force: true}' > "$tmpdir/b"
            must PATCH "$fork/git/refs/heads/$branch" "$tmpdir/b"
          }

          jq -n --arg t "$title" --arg h "$login:$branch" --arg b "$base" \
            --arg body "Automated submission of $ID $VERSION from $ZIP_URL, generated by simit." \
            '{title: $t, head: $h, base: $b, body: $body, maintainer_can_modify: true}' > "$tmpdir/b"
          must POST "/repos/$UP/pulls" "$tmpdir/b"
          echo "winget: opened $(val .html_url)"
          SCRIPT
      - name: Publish wheels to PyPI
        run: |
          set -euo pipefail
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          shopt -s nullglob
          wheels=(release/*.whl)
          if [ "${#wheels[@]}" -eq 0 ]; then publisher_missing pypi 'no release/*.whl to publish'; fi
          nix shell nixpkgs#uv -c uv publish --check-url https://pypi.org/simple/ --trusted-publishing always "${wheels[@]}"
      - name: Prepare Chocolatey package
        id: chocolatey-source
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package preparation."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          ZIP="release/sorrel-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey git+https://github.com/caniko/simit.git?rev=5f468eda08d14f5ad636ec3e5676757693d25ece -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'sorrel' \
            --choco-id 'sorrel' \
            --choco-title 'sorrel' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Native high-performance GUI for manual curation of spike-sorted electrophysiology data.' \
            --choco-project-url 'https://github.com/caniko/sorrel' \
            --choco-license-url 'https://github.com/caniko/sorrel/blob/trunk/LICENSE-MIT' \
            --choco-download-repo 'caniko/sorrel' \
            --choco-archive-pattern 'sorrel-{version}-{arch}-windows.zip' \
            --api-key-env CHOCOLATEY_API_KEY
          printf 'prepared=true\n' >> "$GITHUB_OUTPUT"
      - name: Restore exact Chocolatey candidate
        if: steps.chocolatey-source.outputs.prepared == 'true'
