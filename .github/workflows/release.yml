        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-${{ github.ref }}-${{ github.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
      - name: Pack Chocolatey candidate without publication credentials
        if: steps.chocolatey-source.outputs.prepared == 'true'
        run: |
          set -euo pipefail
          . ./release-env
          ZIP="release/sorrel-${VERSION}-x86_64-windows.zip"
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey git+https://github.com/caniko/simit.git?rev=5f468eda08d14f5ad636ec3e5676757693d25ece -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'sorrel' \
            --choco-id 'sorrel' \
            --choco-title 'sorrel' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Native high-performance GUI for manual curation of spike-sorted electrophysiology data.' \
            --choco-project-url 'https://github.com/caniko/sorrel' \
            --choco-license-url 'https://github.com/caniko/sorrel/blob/trunk/LICENSE-MIT' \
            --choco-download-repo 'caniko/sorrel' \
            --choco-archive-pattern 'sorrel-{version}-{arch}-windows.zip' \
            --pack --api-key-env CHOCOLATEY_API_KEY
      - name: Persist Chocolatey candidate before publication
        if: steps.chocolatey-source.outputs.prepared == 'true' && steps.chocolatey-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-${{ github.ref }}-${{ github.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
      - name: Require persisted Chocolatey candidate
        id: chocolatey-persisted
        if: steps.chocolatey-source.outputs.prepared == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: chocolatey-package/.simit-candidates
          key: chocolatey-${{ github.repository }}-${{ github.ref }}-${{ github.sha }}-${{ hashFiles('chocolatey-package/*.nuspec', 'chocolatey-package/tools/*.ps1') }}
          fail-on-cache-miss: true
      - name: Publish Chocolatey package
        env:
          CHOCO_CANDIDATE_CACHE_HIT: ${{ steps.chocolatey-persisted.outputs.cache-hit }}
          CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
          CHOCO_PUSH_SOURCE: https://push.chocolatey.org/
        run: |
          set -euo pipefail
          . ./release-env
          if [ "$IS_PRERELEASE" = "true" ]; then echo "Prerelease ${VERSION}; skipping Chocolatey package update."; exit 0; fi
          if [ -f release-publisher-state.env ]; then . ./release-publisher-state.env; fi
          publisher_missing() {
            channel="$1"; message="$2"
            var="PUBLISH_$(printf '%s' "$channel" | tr '[:lower:]-' '[:upper:]_')_STATE"
            state="${!var:-inactive-soft}"
            case "$state" in active-required|probe-failed) echo "::error::${channel}: ${message} (${state})" >&2; exit 1 ;; esac
            echo "::warning::${channel}: ${message}; staged publisher is not active yet." >&2
            exit 0
          }
          if [ -z "${CHOCOLATEY_API_KEY:-}" ]; then publisher_missing chocolatey 'CHOCOLATEY_API_KEY unset'; fi
          ZIP="release/sorrel-${VERSION}-x86_64-windows.zip"; test -s "$ZIP" || publisher_missing chocolatey "missing $ZIP"
          if [ "${CHOCO_CANDIDATE_CACHE_HIT:-}" != true ]; then echo 'Chocolatey candidate persistence was not verified.' >&2; exit 1; fi
          nix develop -c nix shell github:caniko/nixpkgs/add-chocolatey-scoop#chocolatey git+https://github.com/caniko/simit.git?rev=5f468eda08d14f5ad636ec3e5676757693d25ece -c simit dist chocolatey bump \
            --version "$VERSION" \
            --package-dir chocolatey-package \
            --archive "x64=$ZIP" \
            --choco-name 'sorrel' \
            --choco-id 'sorrel' \
            --choco-title 'sorrel' \
            --choco-authors 'Can H. Tartanoglu' \
            --choco-description 'Native high-performance GUI for manual curation of spike-sorted electrophysiology data.' \
            --choco-project-url 'https://github.com/caniko/sorrel' \
            --choco-license-url 'https://github.com/caniko/sorrel/blob/trunk/LICENSE-MIT' \
            --choco-download-repo 'caniko/sorrel' \
            --choco-archive-pattern 'sorrel-{version}-{arch}-windows.zip' \
            --push \
            --push-source "$CHOCO_PUSH_SOURCE" \
            --api-key-env CHOCOLATEY_API_KEY
