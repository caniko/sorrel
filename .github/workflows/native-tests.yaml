# Generated by simit. Manual edits will be reported as ci=drift.
name: Native tests

on:
  push:
    branches:
      - "trunk"
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-test-windows:
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Setup windows
        shell: bash
        timeout-minutes: 15
        run: |
          lava="$RUNNER_TEMP\\lavapipe"
          pwsh -NoProfile -File release/fetch-lavapipe-windows.ps1 -Dir "$lava"
          echo "SORREL_LAVAPIPE_ICD=$lava\\lvp_icd.x86_64.json" >> "$GITHUB_ENV"
          echo "$lava" >> "$GITHUB_PATH"

      - name: Native tests windows
        shell: bash
        timeout-minutes: 90
        env:
          SORREL_REQUIRE_GPU: "1"
        run: cargo test --workspace --locked --no-fail-fast
