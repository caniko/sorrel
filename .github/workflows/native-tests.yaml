# Generated by simit. Manual edits will be reported as ci=drift.
name: Native tests

on:
  push:
    branches:
      - "trunk"
    tags-ignore: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  native-test-windows:
    runs-on: windows-2025
    timeout-minutes: 75
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Native tests windows
        shell: bash
        timeout-minutes: 60
        run: cargo test --workspace --locked --no-fail-fast
