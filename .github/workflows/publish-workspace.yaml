        with:
          name: simit-crate-sorrel-io-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/sorrel-io/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive sorrel-compute
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p sorrel-compute | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/sorrel-compute"
          cp "$RUNNER_TEMP/simit-package-target/package/sorrel-compute-$version.crate" "$RUNNER_TEMP/simit-crates/sorrel-compute/"
          size="$(wc -c < "$RUNNER_TEMP/simit-crates/sorrel-compute/sorrel-compute-$version.crate")"
          test "$size" -le 10485760 || { echo "crate sorrel-compute archive is $size bytes, over the crates.io upload limit of 10485760 bytes (10 MiB)" >&2; exit 1; }
      - name: Retain original-run archive sorrel-compute
