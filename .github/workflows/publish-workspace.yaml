          test "$(nix develop -c cargo pkgid --locked -p sorrel-data | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/sorrel-data"
          cp "$RUNNER_TEMP/simit-package-target/package/sorrel-data-$version.crate" "$RUNNER_TEMP/simit-crates/sorrel-data/"
          size="$(wc -c < "$RUNNER_TEMP/simit-crates/sorrel-data/sorrel-data-$version.crate")"
          test "$size" -le 10485760 || { echo "crate sorrel-data archive is $size bytes, over the crates.io upload limit of 10485760 bytes (10 MiB)" >&2; exit 1; }
      - name: Retain original-run archive sorrel-data
